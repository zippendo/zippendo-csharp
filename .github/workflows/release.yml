name: Release

# Zippendo's release pipeline generates this SDK and pushes a version tag; this workflow packs it,
# publishes it to NuGet with trusted publishing, so no API key is stored here, and attests the
# package. The trusted publishing policy on nuget.org names this file, so renaming it stops releases
# until that policy is updated.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # NuGet trusted publishing and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Check the tag matches the package version
        run: test "v$(grep -oP '(?<=<Version>)[^<]+' src/Zippendo/Zippendo.csproj)" = "$GITHUB_REF_NAME"

      - name: Pack
        run: dotnet pack src/Zippendo/Zippendo.csproj -c Release -o nupkg

      # Trades this run's OIDC token for an API key that lasts one hour.
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate makes a failed run safe to re-run.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nupkg/*.nupkg

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes \
            "Install with \`dotnet add package Zippendo --version ${GITHUB_REF_NAME#v}\`. Guide: https://www.zippendo.com/docs/sdks/overview" \
            nupkg/*.nupkg
